<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>T07 Site</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --void:#000000;
    --panel:#000000;
    --panel-2:#000000;
    --hairline:#000000;
    --green:#000000;
    --green-bright:#f8f8f8;
    --amber:#eea005;
    --text:#e7f2ec;
    --text-dim:#8aa89a;
    --danger:#e5484d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(ellipse at top, #0f1c2e 0%, var(--void) 55%);
    color:var(--text); font-family:'Inter',sans-serif;
    display:flex; align-items:flex-start; justify-content:center; padding:56px 24px; min-height:100vh;
  }
  body.mode-auth{ align-items:center; padding-top:24px; padding-bottom:24px;
  }
  .wrap{width:100%; max-width:480px; transition:max-width .2s; position:relative; z-index:1;}
  body.mode-dash .wrap{max-width:1080px;}

  .bg-decor{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  .decor-icon{position:absolute; stroke:var(--green-bright); opacity:.16; filter:drop-shadow(0 0 14px var(--green-bright)) drop-shadow(0 0 30px var(--green-bright));}

  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:stretch;}
  @media (max-width:900px){ .dash-grid{grid-template-columns:1fr;} }
  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:4px; padding:24px;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .stat-tile{background:var(--panel-2); border:1px solid var(--hairline); border-radius:3px; padding:20px 12px; text-align:center;}
  .stat-tile b{display:block; font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--green-bright); font-weight:700;}
  .stat-tile span{font-size:11px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase;}
  .brand{display:flex; align-items:baseline; gap:10px; justify-content:flex-start; margin-bottom:18px;}
  .brand h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:44px; letter-spacing:1px;
    margin:0; color:var(--text);
  }
  .brand h1 span{color:var(--green-bright);}
  .brand .tick{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase;}
  .sub{text-align:center; color:var(--text-dim); font-size:13px; margin-bottom:32px; letter-spacing:.3px;}

  .panel{
    background:var(--panel); border:1px solid var(--hairline); border-radius:4px;
    padding:28px; position:relative; overflow:hidden;
  }
  .panel::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--green-bright), transparent);
  }

  .tabs{display:flex; border:1px solid var(--hairline); border-radius:3px; overflow:hidden; margin-bottom:24px;}
  .tab{flex:1; text-align:center; padding:10px; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; color:var(--text-dim); background:var(--panel-2); transition:.15s;}
  .tab.active{color:var(--void); background:var(--green-bright); font-weight:600;}

  label{display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin:14px 0 6px;}
  input[type=text],input[type=email],input[type=password]{
    width:100%; padding:11px 12px; background:var(--panel-2); border:1px solid var(--hairline);
    border-radius:3px; color:var(--text); font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:.15s;
  }
  input:focus{border-color:var(--green-bright); box-shadow:0 0 0 3px rgba(77,157,255,.15);}

  .btn{
    margin-top:20px; width:100%; padding:12px; border:none; border-radius:3px; cursor:pointer;
    font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:1.5px; text-transform:uppercase;
    background:var(--green-bright); color:#06170f; font-weight:600; transition:.15s;
  }
  .btn:hover{background:#7cbaff;}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn.secondary{background:transparent; border:1px solid var(--hairline); color:var(--text);}
  .btn.danger{background:var(--danger); color:#fff;}

  .msg{font-size:13px; margin-top:14px; padding:10px 12px; border-radius:3px; display:none;}
  .msg.error{display:block; background:rgba(229,72,77,.12); color:#ff9497; border:1px solid rgba(229,72,77,.3);}
  .msg.ok{display:block; background:rgba(77,157,255,.1); color:var(--green-bright); border:1px solid rgba(77,157,255,.3);}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:20px; flex-wrap:wrap;}
  .navtabs{display:flex; gap:6px;}
  .navtab{padding:9px 16px; border-radius:3px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; color:var(--text-dim); border:1px solid transparent;}
  .navtab.active{background:var(--panel-2); color:var(--green-bright); border:1px solid var(--hairline);}
  .navtab:hover{color:var(--text);}

  .team-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:16px;}
  .team-card{background:var(--panel); border:1px solid var(--hairline); border-radius:4px; padding:20px; text-align:center; cursor:pointer; transition:.15s;}
  .team-card:hover{border-color:var(--green-bright); transform:translateY(-2px);}
  .team-shield{width:64px; height:64px; border-radius:4px; object-fit:cover; background:var(--panel-2); border:1px solid var(--hairline); margin:0 auto 12px;}
  .team-name{font-family:'Oswald',sans-serif; font-size:15px; font-weight:600;}
  .team-count{font-size:11px; color:var(--text-dim); margin-top:4px; letter-spacing:.5px;}

  .player-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--panel-2);}
  .player-row img{width:36px; height:36px; border-radius:3px; object-fit:cover; background:var(--panel-2); border:1px solid var(--hairline);}
  .player-row .pname{flex:1; font-size:14px;}
  .back-link{color:var(--text-dim); font-size:12px; cursor:pointer; display:inline-block; margin-bottom:16px; letter-spacing:.5px;}
  .back-link:hover{color:var(--green-bright);}

  .camp-card{background:var(--panel); border:1px solid var(--hairline); border-radius:4px; padding:18px 20px; margin-bottom:12px; cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .camp-card:hover{border-color:var(--green-bright);}
  .camp-title{font-family:'Oswald',sans-serif; font-size:16px; font-weight:600;}
  .camp-meta{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .status-pill{font-family:'JetBrains Mono',monospace; font-size:10px; padding:4px 10px; border-radius:12px; letter-spacing:1px; text-transform:uppercase; border:1px solid var(--hairline); color:var(--text-dim); white-space:nowrap;}
  .status-pill.em_andamento{color:var(--green-bright); border-color:var(--green-bright);}
  .status-pill.finalizado{color:var(--amber); border-color:var(--amber);}
  .form-box{border:1px solid var(--hairline); border-radius:3px; padding:18px; margin-bottom:20px; background:var(--panel-2);}
  .subteam-card{border:1px solid var(--hairline); border-radius:3px; padding:16px; margin-bottom:14px; background:var(--panel-2);}

  .fase-grid{display:grid; grid-template-columns:1fr 380px; gap:24px; align-items:start; margin-top:20px;}
  @media (max-width:900px){ .fase-grid{grid-template-columns:1fr;} }

  .calendar-panel::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--green-bright), transparent);}
  .match-card{background:var(--panel-2); border:1px solid var(--hairline); border-radius:4px; padding:12px 14px; margin-bottom:10px;}
  .match-row{display:flex; align-items:center; gap:10px;}
  .match-row .badge-team{width:32px; height:32px; border-radius:3px; object-fit:cover; background:var(--panel); border:1px solid var(--hairline); flex-shrink:0;}

  .badge-card .bname{font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; margin-bottom:4px;}
  .badge-card .bdesc{font-size:11px; color:var(--text-dim); line-height:1.4;}

  .champion-banner{background:linear-gradient(120deg, var(--panel) 0%, var(--panel-2) 100%); border:1px solid var(--amber); border-radius:4px; padding:28px; display:flex; align-items:center; gap:24px; margin-bottom:24px; flex-wrap:wrap;}
  .champion-banner img{width:76px; height:76px; border-radius:50%; object-fit:cover; border:2px solid var(--amber);}
  .champion-tag{display:inline-block; background:rgba(77,157,255,.15); color:var(--amber); border:1px solid var(--amber); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1px; padding:3px 10px; border-radius:10px; margin-bottom:8px;}

  .bracket-wrap{display:flex; align-items:stretch; gap:32px; overflow-x:auto; padding-bottom:16px;}
  .bracket-col{display:flex; flex-direction:column; justify-content:center; align-items:stretch; min-width:230px; flex-shrink:0;}
  .bracket-col-header{font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); text-align:center; margin-bottom:14px;}
  .bracket-match{background:var(--panel-2); border:1px solid var(--hairline); border-radius:4px; overflow:hidden; position:relative;}
  .bracket-col:not(:last-child) .bracket-match::after{content:''; position:absolute; right:-32px; top:50%; width:32px; height:1px; background:var(--hairline);}
  .bracket-serie{font-size:10px; color:var(--text-dim); padding:6px 10px 0; letter-spacing:.5px; text-align:center;}
  .bracket-team{display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:12px;}
  .bracket-team img{width:22px; height:22px; border-radius:2px; object-fit:cover; background:var(--panel); border:1px solid var(--hairline); flex-shrink:0;}
  .bracket-team .bt-name{flex:1;}
  .bracket-team .bt-score{font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--text-dim);}
  .bracket-team.winner .bt-name{color:var(--green-bright); font-weight:600;}
  .bracket-team.winner .bt-score{color:var(--green-bright);}
  .bracket-match-actions{padding:6px 10px 10px; display:flex; gap:6px; justify-content:flex-end;}
  .who{display:flex; align-items:center; gap:12px;}
  .avatar{width:44px; height:44px; border-radius:3px; background:var(--panel-2); border:1px solid var(--hairline); object-fit:cover;}
  .who-name{font-family:'Oswald',sans-serif; font-size:16px; font-weight:600;}
  .badge{font-family:'JetBrains Mono',monospace; font-size:10px; padding:2px 6px; border-radius:2px; letter-spacing:1px;}
  .badge.admin{background:rgba(77,157,255,.15); color:var(--amber); border:1px solid rgba(77,157,255,.4);}
  .badge.jogador{background:rgba(138,168,154,.12); color:var(--text-dim); border:1px solid var(--hairline);}

  .section-title{font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin:28px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--hairline);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:8px 6px; color:var(--text-dim); font-size:10px; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--hairline);}
  td{padding:9px 6px; border-bottom:1px solid var(--panel-2); vertical-align:middle;}
  .row-avatar{width:26px; height:26px; border-radius:2px; object-fit:cover; background:var(--panel-2); vertical-align:middle; margin-right:8px;}
  select.role-select{background:var(--panel-2); color:var(--text); border:1px solid var(--hairline); border-radius:3px; padding:4px 6px; font-size:12px;}

  input[type=file]{display:none;}
  .hint{font-size:11px; color:var(--text-dim); margin-top:6px;}
</style>

<script>
const SUPABASE_URL = "https://owjrewgputeqzlgjlpzv.supabase.co/rest/v1/";
const ANON_KEY = "sb_publishable_hlNv6xSnpdD4kJu_ZVn0Ow_1AnUKsCX";

let session = null; // { access_token, refresh_token, user }
let profile = null;

const app = document.getElementById('app');

async function api(path, opts={}) {
  const headers = Object.assign({
    'apikey': ANON_KEY,
    'Content-Type': 'application/json'
  }, session ? {'Authorization': 'Bearer ' + session.access_token} : {'Authorization': 'Bearer ' + ANON_KEY}, opts.headers || {});
  const res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) {
    const errMsg = (data && (data.error_description || data.msg || data.message)) || 'Erro na requisição';
    throw new Error(errMsg);
  }
  return data;
}

async function loadProfile() {
  const rows = await api('/rest/v1/profiles?id=eq.' + session.user.id + '&select=*', { headers: {} });
  profile = rows[0] || null;
}

function saveSessionToStorage() {
  try { localStorage.setItem('t90_session', JSON.stringify(session)); } catch(e) {}
}
function clearSessionStorage() {
  try { localStorage.removeItem('t90_session'); } catch(e) {}
}
async function tryRestoreSession() {
  let saved = null;
  try {
    const raw = localStorage.getItem('t90_session');
    if (!raw) return false;
    saved = JSON.parse(raw);
  } catch(e) { return false; }
  try {
    session = saved;
    await loadProfile();
    return true;
  } catch(e) {
    try {
      const data = await api('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        body: JSON.stringify({ refresh_token: saved.refresh_token })
      });
      session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
      await loadProfile();
      saveSessionToStorage();
      return true;
    } catch(e2) {
      clearSessionStorage();
      session = null;
      return false;
    }
  }
}

async function doSignup(nickname, discord, email, password) {
  const data = await api('/auth/v1/signup', {
    method: 'POST',
    body: JSON.stringify({ email, password })
  });
  if (!data.access_token) {
    throw new Error('Verifique seu e-mail para confirmar a conta antes de entrar.');
  }
  session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
  // create profile row
  await api('/rest/v1/profiles', {
    method: 'POST',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify({ id: data.user.id, nickname, discord, role: 'jogador' })
  });
  await loadProfile();
  saveSessionToStorage();
}

async function doLogin(email, password) {
  const data = await api('/auth/v1/token?grant_type=password', {
    method: 'POST',
    body: JSON.stringify({ email, password })
  });
  session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
  await loadProfile();
  saveSessionToStorage();
}

let faseCalendarRodada = null;

const STATUS_LABELS = { em_montagem: 'Em Montagem', em_andamento: 'Em Andamento', finalizado: 'Finalizado' };
const FASE_TIPO_LABELS = { grupos: 'Fase de Grupos', liga: 'Liga', mata_mata: 'Mata-mata' };
const FASE_MATA_LABELS = { oitavas: 'Oitavas de Final', quartas: 'Quartas de Final', semifinal: 'Semifinal', terceiro_lugar: 'Terceiro Lugar', final: 'Final' };
const FASE_MATA_ORDEM = ['oitavas', 'quartas', 'semifinal', 'terceiro_lugar', 'final'];

function simularProbabilidades(standingsAtual, partidasRestantes, vagas, numSim) {
  numSim = numSim || 400;
  if (!standingsAtual.length) return [];
  const contagem = {};
  standingsAtual.forEach(s => { contagem[s.id] = { titulo: 0, classifica: 0 }; });

  for (let sim = 0; sim < numSim; sim++) {
    const tabela = {};
    standingsAtual.forEach(s => { tabela[s.id] = { id: s.id, pts: s.pts, jitter: Math.random() }; });
    partidasRestantes.forEach(p => {
      const r = Math.random();
      const casa = tabela[p.time_casa_id], fora = tabela[p.time_visitante_id];
      if (!casa || !fora) return;
      if (r < 0.4) { casa.pts += 3; }
      else if (r < 0.65) { casa.pts += 1; fora.pts += 1; }
      else { fora.pts += 3; }
    });
    const ordenado = Object.values(tabela).sort((a,b) => b.pts - a.pts || b.jitter - a.jitter);
    if (ordenado[0]) contagem[ordenado[0].id].titulo++;
    ordenado.slice(0, vagas).forEach(t => { if (contagem[t.id]) contagem[t.id].classifica++; });
  }

  return standingsAtual.map(s => ({
    id: s.id, nome: s.nome,
    tituloPct: Math.round((contagem[s.id].titulo / numSim) * 1000) / 10,
    classificaPct: Math.round((contagem[s.id].classifica / numSim) * 1000) / 10
  })).sort((a,b) => b.classificaPct - a.classificaPct || b.tituloPct - a.tituloPct);
}

async function getMaxGolsPartida(profileId) {
  try {
    const jog = await api('/rest/v1/campeonato_jogadores?profile_id=eq.' + profileId + '&select=id', { headers: {} });
    if (!jog.length) return 0;
    const ids = jog.map(j => j.id);
    const gols = await api('/rest/v1/partida_gols?campeonato_jogador_id=in.(' + ids.join(',') + ')&select=quantidade', { headers: {} });
    return gols.length ? Math.max(...gols.map(g => g.quantidade)) : 0;
  } catch(e) { return 0; }
}

function computeStandings(participating, partidas) {
  const table = {};
  participating.forEach(pt => {
    table[pt.id] = { id: pt.id, nome: pt.teams.name, escudo: pt.teams.escudo_url, grupo: pt.grupo, jogos:0, v:0, e:0, d:0, gp:0, gc:0 };
  });
  partidas.filter(p => p.status === 'finalizada').forEach(p => {
    const casa = table[p.time_casa_id], fora = table[p.time_visitante_id];
    if (!casa || !fora) return;
    casa.jogos++; fora.jogos++;
    casa.gp += p.gols_casa; casa.gc += p.gols_visitante;
    fora.gp += p.gols_visitante; fora.gc += p.gols_casa;
    if (p.gols_casa > p.gols_visitante) { casa.v++; fora.d++; }
    else if (p.gols_casa < p.gols_visitante) { fora.v++; casa.d++; }
    else { casa.e++; fora.e++; }
  });
  return Object.values(table).map(t => Object.assign({}, t, { sg: t.gp - t.gc, pts: t.v*3 + t.e })).sort((a,b)=> b.pts-a.pts || b.sg-a.sg || b.gp-a.gp);
}

        await api('/rest/v1/profiles?id=eq.' + p.id, {
          method: 'PATCH',
          body: JSON.stringify({ vitorias: 0, empates: 0, derrotas: 0, gols: 0, titulos: 0, vices: 0 })
        });
      }
      await api('/rest/v1/titulos_jogadores?id=not.is.null', { method: 'DELETE' });

      if (profile.id) { profile.vitorias = 0; profile.empates = 0; profile.derrotas = 0; profile.gols = 0; profile.titulos = 0; profile.vices = 0; }
    } catch(e) { hintEl.textContent = 'Erro: ' + e.message; }

  try {
    const users = await api('/rest/v1/profiles?select=*&order=created_at.desc', { headers: {} });

          ${users.map(u => `
            <tr data-id="${u.id}">

              <td>${u.discord}</td>
              <td>
                <select class="role-select" data-id="${u.id}">
                  <option value="jogador" ${u.role==='jogador'?'selected':''}>Jogador</option>
                  <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                </select>
              </td>
              <td><button class="icon-btn" data-del="${u.id}">Excluir</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('.role-select').forEach(sel => {
      sel.onchange = async () => {
        try {
          await api('/rest/v1/profiles?id=eq.' + sel.dataset.id, { method: 'PATCH', body: JSON.stringify({ role: sel.value }) });
          showMsg('Papel atualizado.', 'ok');
        } catch(e) { showMsg(e.message, 'error'); }
      };
    });
    wrap.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Excluir esta conta permanentemente?')) return;
        try {
          await api('/rest/v1/profiles?id=eq.' + btn.dataset.del, { method: 'DELETE' });
          renderAdminPanel();
        } catch(e) { showMsg(e.message, 'error'); }
      };
    });
  } catch(e) {
    document.getElementById('userTableWrap').textContent = 'Erro ao carregar usuários: ' + e.message;
  }
}

            });

              const path = team.id + '/' + Date.now() + '_' + file.name;

      renderGrid(teams.filter(t => t.name.toLowerCase().includes(q)));

async function avancarVencedorMataMata(campeonatoId, faseId, faseModoConfronto, faseAtual, targetId, targetSlot, vencedorId, perdedorId, campNomeEdicao, allJogadoresList) {
  if (targetId) {
    const slotField = targetSlot === 'casa' ? 'time_casa_id' : 'time_visitante_id';
    await api('/rest/v1/partidas?id=eq.' + targetId, { method: 'PATCH', body: JSON.stringify({ [slotField]: vencedorId }) });
    if (faseModoConfronto === 'ida_volta') {
      const targetRow = (await api('/rest/v1/partidas?id=eq.' + targetId + '&select=*', { headers: {} }))[0];
      const oppositeField = targetSlot === 'casa' ? 'time_visitante_id' : 'time_casa_id';
      await api('/rest/v1/partidas?fase_id=eq.' + targetRow.fase_id + '&fase=eq.' + targetRow.fase + '&rodada=eq.' + targetRow.rodada + '&perna=eq.volta', { method: 'PATCH', body: JSON.stringify({ [oppositeField]: vencedorId }) });
    }
  } else if (faseAtual === 'final') {
    await registrarTitulos(campeonatoId, campNomeEdicao, vencedorId, perdedorId, allJogadoresList);
  }
}

async function registrarTitulos(campeonatoId, nomeEdicao, campeaoTimeId, viceTimeId, allJogadoresList) {
  const campeaoRoster = allJogadoresList.filter(j => j.campeonato_time_id === campeaoTimeId);
  for (const r of campeaoRoster) {
    await api('/rest/v1/titulos_jogadores', { method: 'POST', body: JSON.stringify({ profile_id: r.profile_id, campeonato_id: campeonatoId, nome_edicao: nomeEdicao, tipo: 'campeao' }) });
    const prof = await api('/rest/v1/profiles?id=eq.' + r.profile_id + '&select=titulos', { headers: {} });
    await api('/rest/v1/profiles?id=eq.' + r.profile_id, { method: 'PATCH', body: JSON.stringify({ titulos: (prof[0].titulos||0) + 1 }) });
  }
  if (viceTimeId) {
    const viceRoster = allJogadoresList.filter(j => j.campeonato_time_id === viceTimeId);
    for (const r of viceRoster) {
      await api('/rest/v1/titulos_jogadores', { method: 'POST', body: JSON.stringify({ profile_id: r.profile_id, campeonato_id: campeonatoId, nome_edicao: nomeEdicao, tipo: 'vice' }) });
      const prof = await api('/rest/v1/profiles?id=eq.' + r.profile_id + '&select=vices', { headers: {} });
      await api('/rest/v1/profiles?id=eq.' + r.profile_id, { method: 'PATCH', body: JSON.stringify({ vices: (prof[0].vices||0) + 1 }) });
    }
  }
  await api('/rest/v1/campeonatos?id=eq.' + campeonatoId, { method: 'PATCH', body: JSON.stringify({ status: 'finalizado' }) });
}

async function gerarChaveamentoBracket(campeonatoId, faseId, pares, modoConfronto) {
  const n = pares.length * 2;
  const roundNamesKey = { 16: 'oitavas', 8: 'quartas', 4: 'semifinal', 2: 'final' };
  let roundsChain = [];
  let count = n;
  while (count >= 2) { roundsChain.push(roundNamesKey[count] || ('fase-' + count)); count = count / 2; }

  let nextRoundIda = null;
  for (let r = roundsChain.length - 1; r >= 0; r--) {
    const roundName = roundsChain[r];
    const modoRodada = roundName === 'final' ? 'unico' : modoConfronto;
    const numSlots = n / Math.pow(2, r + 1);
    const createdIdaThisRound = [];
    for (let i = 0; i < numSlots; i++) {
      const casaId = (r === 0 && pares[i]) ? pares[i][0] : null;
      const foraId = (r === 0 && pares[i]) ? pares[i][1] : null;
      const idaPayload = { campeonato_id: campeonatoId, fase_id: faseId, fase: roundName, rodada: i + 1, time_casa_id: casaId, time_visitante_id: foraId };
      if (modoRodada === 'ida_volta') idaPayload.perna = 'ida';
      if (nextRoundIda) {
        idaPayload.proxima_partida_id = nextRoundIda[Math.floor(i / 2)].id;
        idaPayload.proxima_partida_slot = i % 2 === 0 ? 'casa' : 'visitante';
      }
      const criadaIda = (await api('/rest/v1/partidas', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify(idaPayload) }))[0];
      createdIdaThisRound.push(criadaIda);

      if (modoRodada === 'ida_volta') {
        const voltaPayload = { campeonato_id: campeonatoId, fase_id: faseId, fase: roundName, rodada: i + 1, perna: 'volta', time_casa_id: foraId, time_visitante_id: casaId };
        if (nextRoundIda) {
          voltaPayload.proxima_partida_id = nextRoundIda[Math.floor(i / 2)].id;
          voltaPayload.proxima_partida_slot = i % 2 === 0 ? 'casa' : 'visitante';
        }
        await api('/rest/v1/partidas', { method: 'POST', body: JSON.stringify(voltaPayload) });
      }
    }
    nextRoundIda = createdIdaThisRound;
  }
}

async function applyMatchResult(rosterCasa, rosterFora, golsCasa, golsVisitante, scorers) {
  const allIds = [...new Set([...rosterCasa.map(r => r.profile_id), ...rosterFora.map(r => r.profile_id)])];
  if (!allIds.length) return;
  const profilesData = await api('/rest/v1/profiles?id=in.(' + allIds.join(',') + ')&select=id,vitorias,empates,derrotas,gols', { headers: {} });
  const pMap = {};
  profilesData.forEach(p => pMap[p.id] = Object.assign({}, p));

  let resultCasa = golsCasa > golsVisitante ? 'v' : (golsCasa < golsVisitante ? 'd' : 'e');
  let resultFora = resultCasa === 'v' ? 'd' : (resultCasa === 'd' ? 'v' : 'e');

  rosterCasa.forEach(r => {
    const p = pMap[r.profile_id]; if (!p) return;
    if (resultCasa === 'v') p.vitorias++; else if (resultCasa === 'e') p.empates++; else p.derrotas++;
  });
  rosterFora.forEach(r => {
    const p = pMap[r.profile_id]; if (!p) return;
    if (resultFora === 'v') p.vitorias++; else if (resultFora === 'e') p.empates++; else p.derrotas++;
  });
  scorers.forEach(s => { const p = pMap[s.profile_id]; if (!p) return; p.gols += s.quantidade; });

  for (const id of Object.keys(pMap)) {
    const p = pMap[id];
    await api('/rest/v1/profiles?id=eq.' + id, {
      method: 'PATCH',
      body: JSON.stringify({ vitorias: p.vitorias, empates: p.empates, derrotas: p.derrotas, gols: p.gols })
    });
  }
}

    } else {
      matchesSectionHtml = `

      ${fase.tipo === 'mata_mata' ? `

          <div class="calendar-panel" style="margin-top:20px;">

      ` : `
        ${fase.tipo === 'grupos' ? `
          <div class="section-title" style="display:flex; align-items:center; justify-content:space-between;">

            ${profile.role === 'admin' ? '<button class="btn secondary" id="addGrupoBtn" style="width:auto; margin:0; padding:6px 12px; font-size:11px;">+ Adicionar Grupo</button>' : ''}
          </div>

            ${Array.from({length: fase.qtd_grupos || 1}, (_, i) => i + 1).map(g => {

              return `

                    <b class="grupo-titulo" data-grupo="${g}" style="font-family:'Oswald',sans-serif;">${nomeGrupo}</b>
                    ${profile.role === 'admin' ? `<button class="icon-btn edit-grupo-btn" data-grupo="${g}" style="border-color:transparent; color:var(--text-dim); padding:2px 6px;">✎</button>` : ''}

                  ${profile.role === 'admin' && disponiveis.length ? `
                    <div style="display:flex; gap:6px; margin-top:10px;">

        ${faseFilha ? `

            <button class="btn" id="gerarMataMataBtn" style="margin-top:10px;">Finalizar Fase e Gerar Mata-mata</button>
            <div id="gerarMataMataForm"></div>
          </div>
        ` : '')}

        <div class="fase-grid">
          <div>
            ${grupos.length ? grupos.map(g => standingsTableHtml(standings.filter(s => s.grupo === g), 'Classificação · ' + ((fase.grupo_nomes && fase.grupo_nomes[g]) || ('Grupo ' + g)), 2)).join('') : (faseTimes.length ? standingsTableHtml(standings, 'Classificação', Math.min(4, standings.length)) : '<div class="hint">Adicione times à fase para ver a classificação.</div>')}
            ${faseTimes.length ? probabilidadesHtml : ''}
          </div>

          <div class="calendar-panel">
            <div class="section-title" style="margin-top:0;">Calendário</div>

            ${profile.role === 'admin' && faseTimes.length >= 2 ? `
              <div class="form-box">
                <div class="hint">Gera os confrontos ${fase.tipo === 'grupos' ? 'de cada grupo' : 'entre os times da fase'} no modo "${fase.modo_confronto === 'ida_volta' ? 'ida e volta' : '1 confronto'}". Só cria o que ainda não existe.</div>
                <button class="btn" id="gerarPartidasBtn" style="margin-top:10px;">Gerar Partidas</button>
                <div class="hint" id="gerarPartidasHint"></div>
              </div>
            ` : ''}

            ${profile.role === 'admin' && faseTimes.length >= 2 ? `
              <div class="form-box">
                <label>Time Casa</label>
                <select id="matchCasa" class="role-select" style="width:100%; padding:8px;">
                  ${faseTimes.map(ft => `<option value="${ft.campeonato_time_id}">${ft.campeonato_times.teams.name}</option>`).join('')}
                </select>
                <label>Time Visitante</label>
                <select id="matchVisitante" class="role-select" style="width:100%; padding:8px;">
                  ${faseTimes.map(ft => `<option value="${ft.campeonato_time_id}">${ft.campeonato_times.teams.name}</option>`).join('')}
                </select>
                <label>Rodada (opcional)</label>
                <input type="text" id="matchRodada" placeholder="Ex: 1">
                <button class="btn secondary" id="createMatchBtn" style="margin-top:10px;">+ Partida Manual</button>
                <div class="hint" id="matchFormHint"></div>
              </div>
            ` : ''}

            ${matchesSectionHtml}
          </div>
        </div>
      `}
    `;

    const faseFilhaCard = wrap.querySelector('[data-fase]');
    if (faseFilhaCard) faseFilhaCard.onclick = () => { selectedFaseId = faseFilhaCard.dataset.fase; renderFaseDetail(faseFilhaCard.dataset.fase); };

    if (rodadasDisponiveis.length) {
      const idx = rodadasDisponiveis.indexOf(faseCalendarRodada);
      const prevBtn = document.getElementById('prevRodadaBtn');
      const nextBtn = document.getElementById('nextRodadaBtn');
      if (prevBtn) prevBtn.onclick = () => {
        if (idx > 0) { faseCalendarRodada = rodadasDisponiveis[idx - 1]; renderFaseDetail(faseId); }
      };
      if (nextBtn) nextBtn.onclick = () => {
        if (idx < rodadasDisponiveis.length - 1) { faseCalendarRodada = rodadasDisponiveis[idx + 1]; renderFaseDetail(faseId); }
      };
    }

    if (profile.role === 'admin') {
      const addFaseTeamBtn = document.getElementById('addFaseTeamBtn');
      if (addFaseTeamBtn) addFaseTeamBtn.onclick = async () => {
        const ctId = document.getElementById('addFaseTeamSelect').value;
        if (!ctId) return;
        const grupoInput = document.getElementById('addFaseTeamGrupo');
        try {
          await api('/rest/v1/fase_times', {
            method: 'POST',
            body: JSON.stringify({ fase_id: faseId, campeonato_time_id: ctId, grupo: grupoInput ? (parseInt(grupoInput.value) || null) : null })
          });
          renderFaseDetail(faseId);
        } catch(e) { document.getElementById('addFaseTeamHint').textContent = e.message; }
      };

      const addGrupoBtn = document.getElementById('addGrupoBtn');
      if (addGrupoBtn) addGrupoBtn.onclick = async () => {
        try {
          await api('/rest/v1/fases?id=eq.' + faseId, { method: 'PATCH', body: JSON.stringify({ qtd_grupos: (fase.qtd_grupos || 0) + 1 }) });
          renderFaseDetail(faseId);
        } catch(e) { showMsg(e.message, 'error'); }
      };

      wrap.querySelectorAll('.edit-grupo-btn').forEach(btn => {
        btn.onclick = () => {
          const g = btn.dataset.grupo;
          const formEl = wrap.querySelector('.edit-grupo-form[data-grupo="' + g + '"]');
          if (formEl.innerHTML) { formEl.innerHTML = ''; return; }
          const nomeAtual = (fase.grupo_nomes && fase.grupo_nomes[g]) || ('Grupo ' + g);
          formEl.innerHTML = `
            <div style="display:flex; gap:6px; margin:8px 0;">
              <input type="text" class="edit-grupo-input" value="${nomeAtual}" style="flex:1; padding:6px; font-size:12px;">
              <button class="btn secondary save-grupo-nome-btn" data-grupo="${g}" style="width:auto; margin:0; padding:6px 10px; font-size:12px;">Salvar</button>
            </div>
          `;
          formEl.querySelector('.save-grupo-nome-btn').onclick = async () => {
            const novoNome = formEl.querySelector('.edit-grupo-input').value.trim();
            if (!novoNome) return;
            try {
              const novoMapa = Object.assign({}, fase.grupo_nomes || {}, { [g]: novoNome });
              await api('/rest/v1/fases?id=eq.' + faseId, { method: 'PATCH', body: JSON.stringify({ grupo_nomes: novoMapa }) });
              renderFaseDetail(faseId);
            } catch(e) { showMsg(e.message, 'error'); }
          };
        };
      });

      wrap.querySelectorAll('.add-group-team-btn').forEach(btn => {
        btn.onclick = async () => {
          const sel = wrap.querySelector('.add-group-team-select[data-grupo="' + btn.dataset.grupo + '"]');
          const ctId = sel.value;
          if (!ctId) return;
          try {
            await api('/rest/v1/fase_times', {
              method: 'POST',
              body: JSON.stringify({ fase_id: faseId, campeonato_time_id: ctId, grupo: parseInt(btn.dataset.grupo) })
            });
            renderFaseDetail(faseId);
          } catch(e) { showMsg(e.message, 'error'); }
        };
      });

      const mmDefinirBtn = document.getElementById('mmDefinirConfrontosBtn');
      if (mmDefinirBtn) mmDefinirBtn.onclick = () => {
        const checked = [...wrap.querySelectorAll('.mm-team-check:checked')].map(c => ({ id: c.value, nome: c.dataset.nome }));
        const n = checked.length;
        const formEl = document.getElementById('mmConfrontosForm');
        if (n < 2 || (n & (n - 1)) !== 0) { document.getElementById('mmHint').textContent = 'Selecione uma quantidade de times que seja 2, 4, 8 ou 16.'; formEl.innerHTML = ''; return; }
        document.getElementById('mmHint').textContent = '';
        const roundNamesByCount = { 16: 'Oitavas de Final', 8: 'Quartas de Final', 4: 'Semifinal', 2: 'Final' };
        formEl.innerHTML = `
          <div style="margin-top:14px;">
            <div class="hint">Fase inicial: <b>${roundNamesByCount[n]}</b>. Escolha o confronto de cada série (cada time só pode aparecer uma vez):</div>
            ${Array.from({length: n/2}, (_, i) => i).map(i => `
              <div style="display:flex; gap:8px; align-items:center; margin:10px 0;">
                <span class="hint" style="width:56px; flex-shrink:0;">Série ${i+1}</span>
                <select class="role-select mm-pair-select" data-pair="${i}" style="flex:1; padding:7px;">
                  <option value="">Time casa...</option>
                  ${checked.map(t => `<option value="${t.id}">${t.nome}</option>`).join('')}
                </select>
                <select class="role-select mm-pair-select2" data-pair="${i}" style="flex:1; padding:7px;">
                  <option value="">Time visitante...</option>
                  ${checked.map(t => `<option value="${t.id}">${t.nome}</option>`).join('')}
                </select>
              </div>
            `).join('')}
            <button class="btn" id="mmGerarBtn" style="margin-top:14px;">Gerar Chaveamento</button>
          </div>
        `;
        document.getElementById('mmGerarBtn').onclick = async () => {
          const pares = [];
          const usados = new Set();
          let ok = true;
          for (let i = 0; i < n / 2; i++) {
            const casa = formEl.querySelector('.mm-pair-select[data-pair="' + i + '"]').value;
            const fora = formEl.querySelector('.mm-pair-select2[data-pair="' + i + '"]').value;
            if (!casa || !fora || casa === fora || usados.has(casa) || usados.has(fora)) { ok = false; break; }
            usados.add(casa); usados.add(fora);
            pares.push([casa, fora]);
          }
          if (!ok) { document.getElementById('mmHint').textContent = 'Confira os confrontos: cada time só pode aparecer uma vez, e casa/visitante não podem ser o mesmo time.'; return; }
          try {
            for (const t of checked) {
              await api('/rest/v1/fase_times', { method: 'POST', body: JSON.stringify({ fase_id: faseId, campeonato_time_id: t.id }) });
            }
            await gerarChaveamentoBracket(fase.campeonato_id, faseId, pares, fase.modo_confronto);
            renderFaseDetail(faseId);
          } catch(e) { document.getElementById('mmHint').textContent = e.message; }
        };
      };

      const gerarMataMataBtn = document.getElementById('gerarMataMataBtn');
      if (gerarMataMataBtn) gerarMataMataBtn.onclick = () => {
        const formEl = document.getElementById('gerarMataMataForm');
        if (formEl.innerHTML) { formEl.innerHTML = ''; return; }
        let sugestoes = [];
        if (fase.tipo === 'grupos') {
          grupos.forEach(g => {
            const doGrupo = standings.filter(s => s.grupo === g);
            doGrupo.slice(0, 2).forEach((s, idx) => sugestoes.push({ id: s.id, nome: s.nome, grupo: g, colocacao: idx + 1 }));
          });
        } else {
          standings.slice(0, Math.min(8, standings.length)).forEach((s, idx) => sugestoes.push({ id: s.id, nome: s.nome, grupo: null, colocacao: idx + 1 }));
        }
        formEl.innerHTML = `
          <div style="margin-top:14px;">
            <div class="hint">Marque os times classificados (sugestão pré-marcada: ${fase.tipo === 'grupos' ? '2 melhores de cada grupo' : 'top colocados da tabela'}). O total precisa ser uma potência de 2 (2, 4, 8 ou 16).</div>
            ${standings.map(s => `
              <label style="display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px;">
                <input type="checkbox" class="qualifica-check" value="${s.id}" ${sugestoes.some(x => x.id === s.id) ? 'checked' : ''}>
                ${s.nome}${s.grupo ? ' · Grupo ' + s.grupo : ''} (${s.pts} pts)
              </label>
            `).join('')}
            <label>Forma de definir os confrontos</label>
            <select id="pareamentoSelect" class="role-select" style="width:100%; padding:9px;">
              ${fase.tipo === 'grupos' && grupos.length >= 2 && grupos.length % 2 === 0 ? '<option value="cruzamento">Cruzamento entre grupos (1º de um grupo x 2º do outro)</option>' : ''}
              <option value="sorteio">Sorteio aleatório</option>
            </select>
            <label>Modo de confronto do mata-mata</label>
            <select id="mmModoSelect" class="role-select" style="width:100%; padding:9px;">
              <option value="unico">1 jogo decide</option>
              <option value="ida_volta">2 jogos (ida e volta) decidem</option>
            </select>
            <button class="btn" id="confirmGerarMataMataBtn" style="margin-top:14px;">Gerar Chaveamento</button>
            <div class="hint" id="gerarMataMataHint"></div>
          </div>
        `;
        document.getElementById('confirmGerarMataMataBtn').onclick = async () => {
          const hintEl = document.getElementById('gerarMataMataHint');
          const modoConfrontoMM = document.getElementById('mmModoSelect').value;
          const checked = [...formEl.querySelectorAll('.qualifica-check:checked')].map(c => c.value);
          const n = checked.length;
          if (n < 2 || (n & (n - 1)) !== 0) { hintEl.textContent = 'A quantidade de classificados precisa ser 2, 4, 8 ou 16.'; return; }
          const pareamento = document.getElementById('pareamentoSelect').value;
          let qualificados = standings.filter(s => checked.includes(s.id));

          let pares = [];
          if (pareamento === 'cruzamento') {
            const porGrupo = {};
            qualificados.forEach(q => { if (!porGrupo[q.grupo]) porGrupo[q.grupo] = []; porGrupo[q.grupo].push(q); });
            const gruposOrdenados = Object.keys(porGrupo).sort((a,b)=>a-b);
            for (let i = 0; i < gruposOrdenados.length; i += 2) {
              const gA = porGrupo[gruposOrdenados[i]], gB = porGrupo[gruposOrdenados[i+1]];
              if (!gA || !gB) continue;
              pares.push([gA[0], gB[1] || gB[0]]);
              pares.push([gB[0], gA[1] || gA[0]]);
            }
          } else {
            const shuffled = [...qualificados].sort(() => Math.random() - 0.5);
            for (let i = 0; i < shuffled.length; i += 2) pares.push([shuffled[i], shuffled[i+1]]);
          }
          pares = pares.filter(p => p[0] && p[1]).map(p => [p[0].id, p[1].id]);
          if (pares.length !== n / 2) { hintEl.textContent = 'Não foi possível montar os confrontos (confira o cruzamento por grupos). Tentando sorteio...'; }

          try {
            const novaFaseRows = await api('/rest/v1/fases', {
              method: 'POST',
              headers: { 'Prefer': 'return=representation' },
              body: JSON.stringify({ campeonato_id: fase.campeonato_id, nome: 'Mata-mata', tipo: 'mata_mata', ordem: (fase.ordem||1)+1, fase_origem_id: faseId, modo_confronto: modoConfrontoMM })
            });
            const novaFase = novaFaseRows[0];
            for (const timeId of checked) {
              await api('/rest/v1/fase_times', { method: 'POST', body: JSON.stringify({ fase_id: novaFase.id, campeonato_time_id: timeId }) });
            }

            await gerarChaveamentoBracket(fase.campeonato_id, novaFase.id, pares, modoConfrontoMM);

            selectedFaseId = novaFase.id;
            renderFaseDetail(novaFase.id);
          } catch(e) { hintEl.textContent = e.message; }
        };
      };

      wrap.querySelectorAll('[data-remove-fase-team]').forEach(btn => {
        btn.onclick = async () => {
          try {
            await api('/rest/v1/fase_times?id=eq.' + btn.dataset.removeFaseTeam, { method: 'DELETE' });
            renderFaseDetail(faseId);
          } catch(e) { showMsg(e.message, 'error'); }
        };
      });
      const gerarPartidasBtn = document.getElementById('gerarPartidasBtn');
      if (gerarPartidasBtn) gerarPartidasBtn.onclick = async () => {
        const idaVolta = fase.modo_confronto === 'ida_volta';
        const groupsMap = {};
        faseTimes.forEach(ft => {
          const key = fase.tipo === 'grupos' ? (ft.grupo || 'sem_grupo') : 'geral';
          if (!groupsMap[key]) groupsMap[key] = [];
          groupsMap[key].push(ft.campeonato_time_id);
        });

        function gerarRodadas(teamIds) {
          let list = [...teamIds];
          if (list.length % 2 !== 0) list.push(null);
          const n = list.length;
          const rounds = [];
          for (let r = 0; r < n - 1; r++) {
            const pares = [];
            for (let i = 0; i < n / 2; i++) {
              const casa = list[i], fora = list[n - 1 - i];
              if (casa !== null && fora !== null) {
                pares.push(r % 2 === 1 ? [fora, casa] : [casa, fora]);
              }
            }
            rounds.push(pares);
            list = [list[0], list[n - 1], ...list.slice(1, n - 1)];
          }
          return rounds;
        }

        const pairExistingCount = {};
        partidas.forEach(p => {
          const key = [p.time_casa_id, p.time_visitante_id].sort().join('|');
          pairExistingCount[key] = (pairExistingCount[key] || 0) + 1;
        });
        const pairSeen = {};
        const toCreate = [];

        Object.values(groupsMap).forEach(teamIds => {
          if (teamIds.length < 2) return;
          let rounds = gerarRodadas(teamIds);
          if (idaVolta) {
            const volta = rounds.map(round => round.map(([h, a]) => [a, h]));
            rounds = [...rounds, ...volta];
          }
          rounds.forEach((round, idx) => {
            round.forEach(([casa, fora]) => {
              const key = [casa, fora].sort().join('|');
              pairSeen[key] = (pairSeen[key] || 0) + 1;
              const already = pairExistingCount[key] || 0;
              if (pairSeen[key] <= already) return;
              toCreate.push({ campeonato_id: fase.campeonato_id, fase_id: faseId, fase: fase.tipo, time_casa_id: casa, time_visitante_id: fora, rodada: idx + 1 });
            });
          });
        });

        if (!toCreate.length) { document.getElementById('gerarPartidasHint').textContent = 'Todos os confrontos já existem.'; return; }
        if (!confirm('Isso vai criar ' + toCreate.length + ' partida(s) nova(s), organizadas em rodadas. Continuar?')) return;
        try {
          for (const m of toCreate) {
            await api('/rest/v1/partidas', { method: 'POST', body: JSON.stringify(m) });
          }
          renderFaseDetail(faseId);
        } catch(e) { document.getElementById('gerarPartidasHint').textContent = e.message; }
      };

      const createMatchBtn = document.getElementById('createMatchBtn');
      if (createMatchBtn) createMatchBtn.onclick = async () => {
        const casa = document.getElementById('matchCasa').value;
        const visitante = document.getElementById('matchVisitante').value;
        if (casa === visitante) { document.getElementById('matchFormHint').textContent = 'Escolha dois times diferentes.'; return; }
        let payload = { campeonato_id: fase.campeonato_id, fase_id: faseId, time_casa_id: casa, time_visitante_id: visitante };
        if (fase.tipo === 'mata_mata') {
          payload.fase = document.getElementById('matchMataFase').value;
          payload.rodada = parseInt(document.getElementById('matchSerie').value) || null;
        } else {
          payload.fase = fase.tipo;
          payload.rodada = parseInt(document.getElementById('matchRodada').value) || null;
        }
        try {
          await api('/rest/v1/partidas', { method: 'POST', body: JSON.stringify(payload) });
          renderFaseDetail(faseId);
        } catch(e) { document.getElementById('matchFormHint').textContent = e.message; }
      };
      wrap.querySelectorAll('[data-delete-partida]').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm('Excluir esta partida agendada?')) return;
          try {
            await api('/rest/v1/partidas?id=eq.' + btn.dataset.deletePartida, { method: 'DELETE' });
            renderFaseDetail(faseId);
          } catch(e) { showMsg(e.message, 'error'); }
        };
      });
      wrap.querySelectorAll('.toggle-finalize-btn').forEach(btn => {
        btn.onclick = () => {
          const pid = btn.dataset.partida;
          const formEl = document.getElementById('finalizeForm-' + pid);
          if (formEl.innerHTML) { formEl.innerHTML = ''; return; }
          const partida = partidas.find(p => p.id === pid);
          const rosterCasa = allJogadores.filter(j => j.campeonato_time_id === partida.time_casa_id);
          const rosterFora = allJogadores.filter(j => j.campeonato_time_id === partida.time_visitante_id);
          const casaFtWo = faseTimes.find(ft => ft.campeonato_time_id === partida.time_casa_id);
          const foraFtWo = faseTimes.find(ft => ft.campeonato_time_id === partida.time_visitante_id);
          formEl.innerHTML = `
            <div class="form-box" style="margin-top:12px;">
              <label style="display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:0; font-size:13px; color:var(--text);">
                <input type="checkbox" id="woCheck-${pid}"> Dar W.O. (vitória automática 3 x 0)
              </label>
              <div id="woSelectWrap-${pid}" style="display:none; margin-top:10px;">
                <label>Time vencedor</label>
                <select id="woVencedor-${pid}" class="role-select" style="width:100%; padding:9px;">
                  <option value="casa">${casaFtWo ? casaFtWo.campeonato_times.teams.name : 'Time Casa'}</option>
                  <option value="fora">${foraFtWo ? foraFtWo.campeonato_times.teams.name : 'Time Visitante'}</option>
                </select>
              </div>
              <div id="scoreFieldsWrap-${pid}">
                <div style="display:flex; gap:12px; align-items:flex-end; margin-top:14px;">
                  <div><label>Gols Casa</label><input type="text" id="scoreCasa-${pid}" placeholder="0"></div>
                  <div><label>Gols Visitante</label><input type="text" id="scoreVisitante-${pid}" placeholder="0"></div>
                </div>
                ${rosterCasa.length ? `
                  <div class="hint" style="margin-top:14px; margin-bottom:4px;">Gols marcados (time casa)</div>
                  ${rosterCasa.map(r => `
                    <div class="player-row"><span class="pname">${r.profiles.nickname}</span>
                      <input type="text" style="width:60px;" id="gol-${r.id}" placeholder="0"></div>
                  `).join('')}
                ` : ''}
                ${rosterFora.length ? `
                  <div class="hint" style="margin-top:14px; margin-bottom:4px;">Gols marcados (time visitante)</div>
                  ${rosterFora.map(r => `
                    <div class="player-row"><span class="pname">${r.profiles.nickname}</span>
                      <input type="text" style="width:60px;" id="gol-${r.id}" placeholder="0"></div>
                  `).join('')}
                ` : ''}
              </div>
              <button class="btn" id="confirmFinalize-${pid}" style="margin-top:16px;">Confirmar Resultado</button>
              <div class="hint" id="finalizeHint-${pid}"></div>
            </div>
          `;
          document.getElementById('woCheck-' + pid).onchange = (e) => {
            document.getElementById('woSelectWrap-' + pid).style.display = e.target.checked ? 'block' : 'none';
            document.getElementById('scoreFieldsWrap-' + pid).style.display = e.target.checked ? 'none' : 'block';
          };
          document.getElementById('confirmFinalize-' + pid).onclick = async () => {
            const isWo = document.getElementById('woCheck-' + pid).checked;
            let golsCasa, golsVisitante, scorers = [];
            if (isWo) {
              const vencedor = document.getElementById('woVencedor-' + pid).value;
              golsCasa = vencedor === 'casa' ? 3 : 0;
              golsVisitante = vencedor === 'fora' ? 3 : 0;
            } else {
              golsCasa = parseInt(document.getElementById('scoreCasa-' + pid).value) || 0;
              golsVisitante = parseInt(document.getElementById('scoreVisitante-' + pid).value) || 0;
              [...rosterCasa, ...rosterFora].forEach(r => {
                const val = parseInt((document.getElementById('gol-' + r.id) || {}).value) || 0;
                if (val > 0) scorers.push({ campeonato_jogador_id: r.id, profile_id: r.profile_id, quantidade: val });
              });
            }
            try {
              await api('/rest/v1/partidas?id=eq.' + pid, { method: 'PATCH', body: JSON.stringify({ gols_casa: golsCasa, gols_visitante: golsVisitante, status: 'finalizada', wo: isWo }) });
              for (const s of scorers) {
                await api('/rest/v1/partida_gols', { method: 'POST', body: JSON.stringify({ partida_id: pid, campeonato_jogador_id: s.campeonato_jogador_id, quantidade: s.quantidade }) });
              }
              await applyMatchResult(rosterCasa, rosterFora, golsCasa, golsVisitante, scorers);

              await api('/rest/v1/campeonatos?id=eq.' + fase.campeonato_id + '&status=eq.em_montagem', { method: 'PATCH', body: JSON.stringify({ status: 'em_andamento' }) });

              if (fase.tipo === 'mata_mata') {
                let vencedorId = null, perdedorId = null, targetId = partida.proxima_partida_id, targetSlot = partida.proxima_partida_slot;
                if (!partida.perna) {
                  if (golsCasa !== golsVisitante) {
                    vencedorId = golsCasa > golsVisitante ? partida.time_casa_id : partida.time_visitante_id;
                    perdedorId = vencedorId === partida.time_casa_id ? partida.time_visitante_id : partida.time_casa_id;
                  }
                } else {
                  const siblingRows = await api('/rest/v1/partidas?fase_id=eq.' + faseId + '&fase=eq.' + partida.fase + '&rodada=eq.' + partida.rodada + '&id=neq.' + pid + '&select=*', { headers: {} });
                  const sibling = siblingRows[0];
                  if (sibling && sibling.status === 'finalizada') {
                    const idaLeg = partida.perna === 'ida' ? { time_casa_id: partida.time_casa_id, time_visitante_id: partida.time_visitante_id, gols_casa: golsCasa, gols_visitante: golsVisitante } : sibling;
                    const voltaLeg = partida.perna === 'volta' ? { gols_casa: golsCasa, gols_visitante: golsVisitante } : sibling;
                    const timeA = idaLeg.time_casa_id, timeB = idaLeg.time_visitante_id;
                    const totalA = idaLeg.gols_casa + voltaLeg.gols_visitante;
                    const totalB = idaLeg.gols_visitante + voltaLeg.gols_casa;
                    if (totalA !== totalB) {
                      vencedorId = totalA > totalB ? timeA : timeB;
                      perdedorId = vencedorId === timeA ? timeB : timeA;
                    }
                  }
                }
                if (vencedorId) {
                  if (targetId) {
                    const slotField = targetSlot === 'casa' ? 'time_casa_id' : 'time_visitante_id';
                    await api('/rest/v1/partidas?id=eq.' + targetId, { method: 'PATCH', body: JSON.stringify({ [slotField]: vencedorId }) });
                    if (fase.modo_confronto === 'ida_volta') {
                      const targetRow = (await api('/rest/v1/partidas?id=eq.' + targetId + '&select=*', { headers: {} }))[0];
                      const oppositeField = targetSlot === 'casa' ? 'time_visitante_id' : 'time_casa_id';
                      await api('/rest/v1/partidas?fase_id=eq.' + targetRow.fase_id + '&fase=eq.' + targetRow.fase + '&rodada=eq.' + targetRow.rodada + '&perna=eq.volta', { method: 'PATCH', body: JSON.stringify({ [oppositeField]: vencedorId }) });
                    }
                  } else if (partida.fase === 'final') {
                    await registrarTitulos(fase.campeonato_id, campNomeEdicao, vencedorId, perdedorId, allJogadores);
                  }
                }
              }
              renderFaseDetail(faseId);

              const casaFtNews = faseTimes.find(ft => ft.campeonato_time_id === partida.time_casa_id);
              const foraFtNews = faseTimes.find(ft => ft.campeonato_time_id === partida.time_visitante_id);
              const artilheiros = scorers.map(s => {
                const jogador = [...rosterCasa, ...rosterFora].find(r => r.id === s.campeonato_jogador_id);
                return { nome: jogador ? jogador.profiles.nickname : '?', gols: s.quantidade };
              });
              const faseLabelNews = fase.tipo === 'mata_mata' ? FASE_MATA_LABELS[partida.fase] : FASE_TIPO_LABELS[fase.tipo];
              gerarNoticiaPartida(
                fase.campeonato_id, pid,
                casaFtNews ? casaFtNews.campeonato_times.teams.name : 'Time Casa',
                foraFtNews ? foraFtNews.campeonato_times.teams.name : 'Time Visitante',
                golsCasa, golsVisitante, faseLabelNews, artilheiros
              );
            } catch(e) { document.getElementById('finalizeHint-' + pid).textContent = e.message; }
          };
        };
      });
    }
  } catch(e) {
    document.getElementById('faseDetailWrap').textContent = 'Erro ao carregar fase: ' + e.message;
  }
}

async function renderPartidasPendentesView() {
  app.innerHTML = sidebarHtml('partidas') + `
    <div class="main-content">
      <div class="who-name" style="font-size:22px;">Suas Partidas Pendentes</div>
      <div class="hint" style="margin-bottom:20px;">Jogos agendados dos times em que você está escalado, ainda não finalizados</div>
      <div id="partidasPendentesWrap"><div class="hint">Carregando...</div></div>
    </div>
  `;
  wireSidebar();
  try {
    const myRoster = await api('/rest/v1/campeonato_jogadores?profile_id=eq.' + session.user.id + '&select=campeonato_time_id', { headers: {} });
    const wrap = document.getElementById('partidasPendentesWrap');
    if (!myRoster.length) { wrap.innerHTML = '<div class="hint">Você ainda não está escalado em nenhum time de campeonato.</div>'; return; }
    const ids = myRoster.map(r => r.campeonato_time_id);
    const partidas = await api('/rest/v1/partidas?status=eq.agendada&or=(time_casa_id.in.(' + ids.join(',') + '),time_visitante_id.in.(' + ids.join(',') + '))&select=*', { headers: {} });
    if (!partidas.length) { wrap.innerHTML = '<div class="hint">Nenhuma partida pendente. Você está em dia!</div>'; return; }
    const allCtIds = [...new Set(partidas.flatMap(p => [p.time_casa_id, p.time_visitante_id]))];
    const cts = await api('/rest/v1/campeonato_times?id=in.(' + allCtIds.join(',') + ')&select=id,teams(name,escudo_url)', { headers: {} });
    const ctMap = {}; cts.forEach(c => ctMap[c.id] = c.teams);
    wrap.innerHTML = partidas.map(p => `
      <div class="match-card">
        <div class="match-row">
          <img class="badge-team" src="${teamLogoUrl(ctMap[p.time_casa_id] ? ctMap[p.time_casa_id].escudo_url : null)}">
          <span class="mc-name">${ctMap[p.time_casa_id] ? ctMap[p.time_casa_id].name : '?'}</span>
          <span class="score">vs</span>
          <span class="mc-name">${ctMap[p.time_visitante_id] ? ctMap[p.time_visitante_id].name : '?'}</span>
          <img class="badge-team" src="${teamLogoUrl(ctMap[p.time_visitante_id] ? ctMap[p.time_visitante_id].escudo_url : null)}">
        </div>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('partidasPendentesWrap').textContent = 'Erro ao carregar partidas: ' + e.message;
  }
}

const FLATKEY_API_KEY = "sk-LfzJuZUmjUkfAolcBLFalg3WzJC05QngSabgS0DmviPmsjno";

async function gerarNoticiaPartida(campeonatoId, partidaId, nomeCasa, nomeFora, golsCasa, golsVisitante, faseLabel, artilheiros) {
  try {
    const artilheirosTxt = artilheiros.length ? artilheiros.map(a => a.nome + ' (' + a.gols + ')').join(', ') : 'nenhum artilheiro registrado';
    const prompt = `Você é o redator esportivo do site de e-sports "T07". Escreva uma notícia curta (3 a 5 frases) em português, tom empolgante de jornalismo esportivo, sobre esta partida que acabou de ser finalizada:
Confronto: ${nomeCasa} ${golsCasa} x ${golsVisitante} ${nomeFora}
Fase: ${faseLabel}
Artilheiros: ${artilheirosTxt}
Responda APENAS em JSON puro, sem markdown, sem crases, no formato exato: {"titulo": "...", "conteudo": "..."}`;
    const response = await fetch('https://router.flatkey.ai/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': FLATKEY_API_KEY,
        'anthropic-version': '2023-06-01',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await response.json();
    const texto = (data.content || []).map(c => c.text || '').join('').replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(texto);
    await api('/rest/v1/noticias', {
      method: 'POST',
      body: JSON.stringify({ campeonato_id: campeonatoId, partida_id: partidaId, titulo: parsed.titulo, conteudo: parsed.conteudo })
    });
  } catch(e) {
    console.warn('Não foi possível gerar a notícia automática:', e.message);
  }
}

function renderCurrentView() {
  if (currentView === 'times') renderTeamsView();
  else if (currentView === 'team-detail') renderTeamDetail(selectedTeamId);
  else if (currentView === 'campeonatos') renderCampeonatosView();
  else if (currentView === 'campeonato-detail') renderCampeonatoDetail(selectedCampeonatoId);
  else if (currentView === 'fase-detail') renderFaseDetail(selectedFaseId);
  else if (currentView === 'dashboard') renderDashboardView();
  else if (currentView === 'jogadores') renderJogadoresView();
  else if (currentView === 'ranking') renderRankingView();
  else if (currentView === 'titulos') renderTitulosView();
  else if (currentView === 'partidas') renderPartidasPendentesView();
  else if (currentView === 'noticias') renderNoticiasView();
  else if (currentView === 'jogador-perfil') renderJogadorPerfilView(selectedJogadorPerfilId);
  else renderProfileView();
}

function render() {
  if (session && profile) { document.body.className = 'mode-dash'; renderCurrentView(); }
  else if (session && !profile) renderCompleteProfile();
  else renderAuth('login');
}

(async () => {
  await tryRestoreSession();
  render();
})();
</script>
